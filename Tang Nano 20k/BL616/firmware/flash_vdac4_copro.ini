[cfg]
# 0: no erase, 1: programmed section erase, 2: chip erase
erase = 1
# skip mode set first para is skip addr, second para is skip len, multi-segment region with ; separated
skip_mode = 0x0, 0x0
# 0: not use isp mode, #1: isp mode
boot2_isp_mode = 0

# Сопроцессор FT812 VDAC4 — вторичная прошивка за FPGA Partner (он уже стоит с 0x0 и не
# перезаписывается): на место FPGA Companion MiSTle.
[custom]
filedir = ./vdac4_copro_bl616.bin
address = 0x40000

<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 680 500" role="img"><style>
text{font-family:"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#1f1e1d}
.ts{font-size:12px;fill:#5f5e5a}
.th{font-size:14px;font-weight:600;fill:#1f1e1d}
.box{fill:#f7f6f2;stroke:#b4b2a9}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber>.th{fill:#633806}
.c-amber>.ts{fill:#854F0B}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray>.th{fill:#444441}
.c-gray>.ts{fill:#5F5E5A}
.c-blue>rect,rect.c-blue{fill:#E6F1FB;stroke:#185FA5}
.c-blue>.th{fill:#0C447C}
.c-blue>.ts{fill:#185FA5}
</style><rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
<title>Подключение модуля GY-PCM5102 к ESP32-S3-Zero на плате A4</title>
<desc>ESP32 GPIO1, GPIO8, GPIO2 идут на BCK, DIN, LCK модуля. SCK и GND модуля на A_GND, VIN от +5V_FUSED. Выходы LOUT и ROUT через R17/R18 27k с перемычками JP5/JP6 на J2. Выводы настройки FMT, XSMT, DEMP, FLT через перемычки JP1–JP4: на A_GND, XSMT на A3V3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="80" width="150" height="140" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="100" text-anchor="middle" dominant-baseline="central">ESP32-S3-Zero</text>
<text class="ts" x="115" y="118" text-anchor="middle" dominant-baseline="central">A2</text>
<text class="ts" x="182" y="140" text-anchor="end" dominant-baseline="central">GPIO1</text>
<text class="ts" x="182" y="170" text-anchor="end" dominant-baseline="central">GPIO8</text>
<text class="ts" x="182" y="200" text-anchor="end" dominant-baseline="central">GPIO2</text>
<text class="ts" x="234" y="130" text-anchor="middle" dominant-baseline="central">I2S_BCK</text>
<line x1="190" y1="140" x2="278" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="234" y="160" text-anchor="middle" dominant-baseline="central">I2S_DIN</text>
<line x1="190" y1="170" x2="278" y2="170" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="234" y="190" text-anchor="middle" dominant-baseline="central">I2S_LRCK</text>
<line x1="190" y1="200" x2="278" y2="200" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="280" y="40" width="150" height="330" rx="8" stroke-width="0.5"/>
<text class="th" x="355" y="58" text-anchor="middle" dominant-baseline="central">GY-PCM5102</text>
<text class="ts" x="355" y="76" text-anchor="middle" dominant-baseline="central">A3, гнёзда J10/J11</text>
<text class="ts" x="288" y="110" dominant-baseline="central">SCK</text>
<text class="ts" x="288" y="140" dominant-baseline="central">BCK</text>
<text class="ts" x="288" y="170" dominant-baseline="central">DIN</text>
<text class="ts" x="288" y="200" dominant-baseline="central">LCK</text>
<text class="ts" x="288" y="230" dominant-baseline="central">GND</text>
<text class="ts" x="288" y="260" dominant-baseline="central">VIN</text>
<text class="ts" x="422" y="110" text-anchor="end" dominant-baseline="central">LOUT</text>
<text class="ts" x="422" y="140" text-anchor="end" dominant-baseline="central">AGND</text>
<text class="ts" x="422" y="170" text-anchor="end" dominant-baseline="central">ROUT</text>
<text class="ts" x="422" y="200" text-anchor="end" dominant-baseline="central">AGND</text>
<text class="ts" x="422" y="230" text-anchor="end" dominant-baseline="central">A3V3</text>
<text class="ts" x="422" y="260" text-anchor="end" dominant-baseline="central">FMT</text>
<text class="ts" x="422" y="290" text-anchor="end" dominant-baseline="central">XSMT</text>
<text class="ts" x="422" y="320" text-anchor="end" dominant-baseline="central">DEMP</text>
<text class="ts" x="422" y="350" text-anchor="end" dominant-baseline="central">FLT</text>
<text class="ts" x="242" y="110" text-anchor="end" dominant-baseline="central">A_GND</text>
<line x1="246" y1="110" x2="280" y2="110" class="arr"/>
<text class="ts" x="242" y="230" text-anchor="end" dominant-baseline="central">A_GND</text>
<line x1="246" y1="230" x2="280" y2="230" class="arr"/>
<text class="ts" x="242" y="260" text-anchor="end" dominant-baseline="central">+5V_FUSED</text>
<line x1="246" y1="260" x2="278" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="110" x2="468" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber">
<rect x="470" y="80" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="98" text-anchor="middle" dominant-baseline="central">R17 27k ∥ JP5</text>
<text class="ts" x="555" y="116" text-anchor="middle" dominant-baseline="central">→ J2.1 → Evo X17</text>
</g>
<line x1="430" y1="170" x2="468" y2="170" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber">
<rect x="470" y="146" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="164" text-anchor="middle" dominant-baseline="central">R18 27k ∥ JP6</text>
<text class="ts" x="555" y="182" text-anchor="middle" dominant-baseline="central">→ J2.4 → Evo X17</text>
</g>
<path d="M430 230 L600 230 L600 290 L516 290" fill="none" class="arr"/>
<line x1="430" y1="260" x2="472" y2="260" class="arr"/>
<g class="c-amber"><rect x="472" y="249" width="44" height="22" rx="4" stroke-width="0.5"/><text class="th" x="494" y="260" text-anchor="middle" dominant-baseline="central">JP1</text></g>
<line x1="516" y1="260" x2="530" y2="260" class="arr"/>
<text class="ts" x="534" y="260" dominant-baseline="central">A_GND</text>
<line x1="430" y1="290" x2="472" y2="290" class="arr"/>
<g class="c-amber"><rect x="472" y="279" width="44" height="22" rx="4" stroke-width="0.5"/><text class="th" x="494" y="290" text-anchor="middle" dominant-baseline="central">JP2</text></g>
<line x1="430" y1="320" x2="472" y2="320" class="arr"/>
<g class="c-amber"><rect x="472" y="309" width="44" height="22" rx="4" stroke-width="0.5"/><text class="th" x="494" y="320" text-anchor="middle" dominant-baseline="central">JP3</text></g>
<line x1="516" y1="320" x2="530" y2="320" class="arr"/>
<text class="ts" x="534" y="320" dominant-baseline="central">A_GND</text>
<line x1="430" y1="350" x2="472" y2="350" class="arr"/>
<g class="c-amber"><rect x="472" y="339" width="44" height="22" rx="4" stroke-width="0.5"/><text class="th" x="494" y="350" text-anchor="middle" dominant-baseline="central">JP4</text></g>
<line x1="516" y1="350" x2="530" y2="350" class="arr"/>
<text class="ts" x="534" y="350" dominant-baseline="central">A_GND</text>
<text class="ts" x="40" y="400" dominant-baseline="central">JP1 FMT=L — формат I2S · JP2 XSMT=H — звук включён</text>
<text class="ts" x="40" y="420" dominant-baseline="central">JP3 DEMP=L — без коррекции · JP4 FLT=L — обычный фильтр</text>
<text class="ts" x="40" y="440" dominant-baseline="central">JP5/JP6: без пайки 27k · «15k» → 15,05k, +3,5 дБ · «9k1» → 9,09k, +6,0 дБ</text>
<text class="ts" x="40" y="460" dominant-baseline="central">SCK, GND, AGND → A_GND (с GND в одной точке NT1) · VIN ← +5V_FUSED после F1</text>
<rect class="c-amber" x="40" y="474" width="16" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="62" y="480" dominant-baseline="central">выбирается каплей припоя, снизу платы</text>
</svg>
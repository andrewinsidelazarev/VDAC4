<text class="ts" x="360" y="258" text-anchor="middle" dominant-baseline="central">3,3 → 5 В</text>
<rect class="box" x="436" y="220" width="100" height="56" rx="4" stroke-width="0.5"/>
<text class="th" x="486" y="238" text-anchor="middle" dominant-baseline="central">U6 1G97</text>
<text class="ts" x="486" y="258" text-anchor="middle" dominant-baseline="central">ESP / Tang</text>
<rect class="box" x="308" y="304" width="104" height="56" rx="4" stroke-width="0.5"/>
<text class="th" x="360" y="322" text-anchor="middle" dominant-baseline="central">U7 NAND</text>
<text class="ts" x="360" y="342" text-anchor="middle" dominant-baseline="central">включает U8</text>

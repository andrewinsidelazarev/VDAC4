<text class="ts" x="118" y="258" text-anchor="middle" dominant-baseline="central">R20 1 кОм к +5 В</text>
<rect class="c-gray" x="208" y="84" width="76" height="192" rx="4" stroke-width="0.5"/>
<text class="ts" x="246" y="104" text-anchor="middle" dominant-baseline="central">35 SCK</text>
<text class="ts" x="246" y="140" text-anchor="middle" dominant-baseline="central">33 MOSI</text>
<text class="ts" x="246" y="176" text-anchor="middle" dominant-baseline="central">1 CS</text>
<text class="th" x="246" y="62" text-anchor="middle" dominant-baseline="central">IDE-40</text>
<text class="ts" x="246" y="248" text-anchor="middle" dominant-baseline="central">27 MISO</text>
<rect class="box" x="308" y="84" width="120" height="112" rx="4" stroke-width="0.5"/>
<text class="th" x="368" y="130" text-anchor="middle" dominant-baseline="central">U3 74LVC245</text>

<text class="th" x="89" y="120" text-anchor="middle" dominant-baseline="central">D12</text>
<text class="ts" x="89" y="140" text-anchor="middle" dominant-baseline="central">74HCT245</text>
<text class="ts" x="89" y="158" text-anchor="middle" dominant-baseline="central">5 В</text>
<rect class="box" x="144" y="162" width="42" height="28" rx="4" stroke-width="0.5"/>

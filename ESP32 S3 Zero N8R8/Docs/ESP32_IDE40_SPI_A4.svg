</style><rect x="0" y="0" width="680" height="430" fill="#ffffff"/><title>Линия SPI между разъёмом IDE-40 ZX Evolution и ESP32 на плате A4</title><desc>SCK, MOSI и CS идут от буфера D12 Эво через контакты 35, 33 и 1 разъёма IDE-40 и буфер U3 платы к GPIO12, GPIO11 и GPIO10 модуля ESP32. Обратно MISO идёт от GPIO13 через селектор U6 и преобразователь уровня U8 на контакт 27 и вход ПЛИС Эво.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow_1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow_534AB7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
